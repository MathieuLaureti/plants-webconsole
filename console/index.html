<!DOCTYPE html>
<html lang="en">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      @font-face {
        font-family: 'OCRB';
        src: url('./OCRBRegular.ttf') format('truetype');
      }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                        'bg-dark': 'oklch(0.1 0.025 247)',
                        bg: 'oklch(0.15 0.025 247)',
                        'bg-light': 'oklch(0.2 0.025 247)',
                        text: 'oklch(0.96 0.05 247)',
                        'text-muted': 'oklch(0.76 0.05 247)',
                        highlight: 'oklch(0.5 0.05 247)',
                        border: 'oklch(0.4 0.05 247)',
                        'border-muted': 'oklch(0.3 0.05 247)',
                        primary: 'oklch(0.76 0.1 247)',
                        secondary: 'oklch(0.76 0.1 67)',
                        danger: 'oklch(0.7 0.05 30)',
                        warning: 'oklch(0.7 0.05 100)',
                        success: 'oklch(0.7 0.05 160)',
                        info: 'oklch(0.7 0.05 260)',
                    },
                    fontFamily: {
                        'sans': ['OCRB', 'monospace'],
                    }
                }
            }
        }
    </script>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">

        <title>Web Console</title>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="icon" href="./favicon.ico" type="image/x-icon">
    </head>
    <body class="bg-bg-dark">
        <div id="login_panel" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-bg-dark p-4">
            <form id="login_form" class="bg-bg border border-border rounded-xl p-8 w-full max-w-md">
                <h1 class="text-3xl text-text text-center mb-6">Plant Console</h1>
                <label class="block text-text-muted mb-1" for="login_username">Username</label>
                <input id="login_username" name="username" autocomplete="username"
                    class="w-full mb-4 bg-bg-light border border-border rounded-lg p-2 text-text" required />
                <label class="block text-text-muted mb-1" for="login_password">Password</label>
                <input id="login_password" name="password" type="password" autocomplete="current-password"
                    class="w-full mb-4 bg-bg-light border border-border rounded-lg p-2 text-text" required />
                <p id="login_error" class="hidden text-danger text-sm mb-3"></p>
                <button type="submit"
                    class="w-full bg-bg-light rounded-xl text-text text-xl font-semibold h-12 border border-border">
                    Sign in
                </button>
            </form>
        </div>

        <main id="app_main" class="hidden px-2 py-4">
            <div class="flex flex-row bg-bg border border-border rounded-xl p-2 w-full max-w-[1250px] mx-auto box-border max-[1250px]:flex-col max-[1250px]:max-w-[750px]">
                <div class="w-[484px] max-w-full shrink-0 pr-2 flex flex-col min-w-0 max-[1250px]:w-full max-[1250px]:pr-0 max-[1250px]:mt-4">
                    <h2 class="text-4xl mb-1 font-semibold text-text bg-bg-light border border-border w-full rounded-xl text-center h-1/12">Temperature °C</h2>
                    <div class="flex-1 relative h-[268px] max-[1250px]:h-[180px]">
                        <canvas id="tempChart" class="w-full h-full"></canvas>
                    </div>

                    <h2 class="text-4xl my-1 font-semibold text-text bg-bg-light border border-border w-full rounded-xl text-center h-1/12">Humidity</h2>
                    <div class="flex-1 relative h-[268px] max-[1250px]:h-[180px]">
                        <canvas id="humChart" class="w-full h-full"></canvas>
                    </div>

                    <div id="plug_schedule_panel"
                        class="mt-2 bg-bg-light border border-border rounded-xl px-2 py-2 text-text w-full min-w-0">
                        <h2 class="text-lg font-semibold text-center mb-1">Plug pulse</h2>
                        <div class="flex items-stretch gap-2 min-w-0">
                            <div id="plug_edit_row" class="flex flex-1 gap-2 min-w-0 text-xs text-text-muted">
                                <label class="flex flex-col gap-0.5 w-[4.5rem] shrink-0">
                                    <span>Wait (m)</span>
                                    <input id="plug_interval" type="number" min="1" max="1440" value="5"
                                        class="bg-bg border border-border rounded-lg px-1 py-1 text-text text-center text-sm w-full" />
                                </label>
                                <label class="flex flex-col gap-0.5 w-[4.5rem] shrink-0">
                                    <span>ON (m)</span>
                                    <input id="plug_on_duration" type="number" min="1" max="1440" value="1"
                                        class="bg-bg border border-border rounded-lg px-1 py-1 text-text text-center text-sm w-full" />
                                </label>
                            </div>
                            <div id="plug_run_row" class="hidden flex-1 items-center gap-2 min-w-0 text-sm text-text-muted">
                                <span id="plug_indicator" class="text-xl leading-none text-border-muted shrink-0" aria-hidden="true">●</span>
                                <p id="plug_countdown" class="truncate min-w-0">—</p>
                            </div>
                            <button id="plug_power_toggle" type="button" title="Schedule off"
                                class="shrink-0 w-12 h-12 rounded-xl border-2 border-danger bg-danger/25 text-text text-2xl leading-none flex items-center justify-center disabled:opacity-40"
                                aria-label="Toggle plug schedule">
                                ⏻
                            </button>
                        </div>
                        <p id="plug_status" class="hidden text-xs text-center text-danger mt-1 truncate">Loading…</p>
                    </div>
                </div>
                <div class="flex-1 min-w-0 max-w-[750px] max-[1250px]:order-first max-[1250px]:max-w-full">
                    <div class="h-1/12">
                        <h1 class="text-4xl font-semibold text-text bg-bg-light border border-border w-full rounded-xl text-center h-full">Plant Console</h1>
                    </div>
                    <div class="h-3/4 mt-2">
                        <img id="last_image_offset" src="https://placehold.co/1600x1200" alt="Latest capture"
                            class="bg-bg-light border border-border w-full rounded-xl h-full">
                    </div>
                    <div class="flex w-full h-1/12 mt-2">
                        <button id="prev" type="button" class="bg-bg-light rounded-xl text-text text-2xl font-semibold w-1/3 mr-[2px] h-16 border border-border p-2">&lt;</button>
                        <button id="camera_button" type="button" class="bg-bg-light rounded-xl text-text text-xl md:text-2xl w-1/3 mx-2 h-16 border border-border p-2">Camera 1</button>
                        <button id="next" type="button" class="bg-bg-light rounded-xl text-text text-2xl font-semibold w-1/3 ml-[2px] h-16 border border-border p-2">&gt;</button>
                    </div>
                    <div class="flex w-full h-1/12 mt-2">
                        <button id="timestamp" type="button" class="bg-bg-light rounded-xl text-text text-xs sm:text-l w-1/3 mr-2 h-12 border border-border p-2 text-center">[date]</button>
                        <button id="day_week_month" type="button" class="bg-bg-light rounded-xl text-text text-2xl w-1/3 mx-2 h-12 border border-border p-2">day</button>
                        <button id="slideshow" type="button" class="bg-bg-light rounded-xl text-text text-2xl w-1/3 ml-2 h-12 border border-border p-2">▶</button>
                    </div>
                </div>
            </div>
        </main>

        <script type="module" src="./js/main.js"></script>
    </body>
</html>
